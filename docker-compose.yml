services:
  app:
    build: .
    container_name: koala
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.koala.rule=Host(`koala.pavlin.dev`)"
      - "traefik.http.routers.koala.entrypoints=web"
      - "traefik.http.services.koala.loadbalancer.server.port=3000"
    networks:
      - web

networks:
  web:
    external: true
